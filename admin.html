    <script>
        const supabaseUrl = 'https://ilxdnwapvrpofxnurboe.supabase.co';
        const supabaseKey = 'sb_publishable_TXbv2AjCh5IimCbTRXZ2hw_hZUMqo6K';
        // غيرنا الاسم هنا إلى supabaseClient لتفادي التعارض
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // --- GEMINI API INTEGRATION (SECURE SUPABASE EDGE FUNCTION) ---
        const Gemini = {
            async call(prompt, isJson = false, systemPrompt = "You are Atlas, a smart university admin assistant.") {
                let retries = 3;
                let delays = [1000, 2000, 4000];
                
                for (let i = 0; i < retries; i++) {
                    try {
                        // استخدام مكتبة Supabase لاستدعاء الخادم بشكل آمن جداً
                        // ملاحظة: هذا يتطلب أن يكون المتغير 'supabaseClient' معرفاً في مشروعك
                        const { data, error } = await supabaseClient.functions.invoke('gemini-proxy', {
                            body: { prompt, isJson, systemPrompt }
                        });

                        if (error) throw new Error(error.message);
                        if (!data.success) throw new Error(data.error || "Unknown error from proxy");
                        
                        return data.text; // إرجاع النص الصافي من جيميناي
                        
                    } catch (e) {
                        if (i === retries - 1) throw e;
                        await new Promise(r => setTimeout(r, delays[i]));
                    }
                }
            }
        };

        // --- 1. DATA & STATE ---
        let adminViewLevel = 'all'; // 'all', 'department', 'institute', 'university'

        const DB = {
            settings: {
                specs: '',
                institutes: [],
                faculties: [],
                system: 'lmd',
                concernTypes: ['بيداغوجي', 'تقني', 'إداري', 'خدماتي', 'أخرى'],
                aiEnabled: true,
                logo: null
            },
            issues: [], // Empty to test real incoming data
            teachers: [],
            posts: [], // Empty to test real incoming data
            syncFromServer: async function() {
                try {
                    // Auth Middleware
                    const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
                    if (sessionError || !sessionData.session) { /* window.location.href = 'index.html'; return; */ }
                    
                    const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', sessionData?.session?.user?.id).single();
                    const safeProfile = profile || {};
                    if (safeProfile.role !== 'admin' && sessionData?.session?.user?.user_metadata?.role !== 'admin') { /* window.location.href = 'index.html'; return; */ }

                    const { data: complaints, error } = await supabaseClient.from('complaints').select('*, profiles(first_name, last_name, avatar_url)').order('created_at', { ascending: false });
                    if (error) throw error;

                    DB.issues = (complaints || []).map(c => ({
                        id: c.id,
                        author_id: c.author_id,
                        author: c.profiles ? `${c.profiles.first_name || ''} ${c.profiles.last_name || ''}` : 'مستخدم',
                        role: c.author_role || 'student',
                        type: c.author_role || 'student',
                        cat: c.category || 'عام',
                        title: c.title || (c.content || '').slice(0, 60),
                        desc: c.content || '',
                        img: c.media_url || null,
                        status: c.status,
                        assigned_level: c.assigned_level || 'department',
                        admin_notes: c.admin_notes || '',
                        admin_reply: c.admin_reply || '',
                        time: new Date(c.created_at).toLocaleTimeString('ar-SA'),
                        date: new Date(c.created_at).toLocaleDateString('ar-SA')
                    }));
                    
                    Router.refresh();
                } catch (err) { console.error('Error syncing:', err); }
            }
        };

        // --- 2. LOCALIZATION ---
        const I18n = {
            data: window.I18nModule.I18nData,
            current: 'ar',
            get: (key) => window.I18nModule.getTranslation(I18n.data, I18n.current, key),
            set: (lang) => {
                I18n.current = lang;
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.getElementById('current-lang').innerText = lang.toUpperCase();
                
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = I18n.get(el.getAttribute('data-i18n'));
                    } else {
                        el.innerText = I18n.get(el.getAttribute('data-i18n'));
                    }
                });
                
                const inputs = ['post-title', 'post-body', 'ai-input'];
                inputs.forEach(id => {
                    const el = document.getElementById(id);
                    if(el) {
                        if(id === 'post-title') el.placeholder = I18n.get('pub_t_ph');
                        if(id === 'post-body') el.placeholder = I18n.get('pub_b_ph');
                        if(id === 'ai-input') el.placeholder = I18n.get('ai_ph');
                        el.style.direction = lang === 'ar' ? 'rtl' : 'ltr';
                    }
                });

                document.getElementById('chat-messages').innerHTML = '';
                setTimeout(() => AI.append(I18n.get('ai_welcome'), 'ai'), 300);
                
                // Force UI update for sidebar
                const s = document.getElementById('sidebar');
                if(window.innerWidth >= 1024) {
                    s.classList.remove('ltr:-translate-x-full', 'rtl:translate-x-full', '-translate-x-full', 'translate-x-full');
                } else {
                    s.classList.add('ltr:-translate-x-full', 'rtl:translate-x-full');
                    document.getElementById('mobile-overlay').classList.add('hidden');
                }

                Router.refresh();
            }
        };

        const Lang = I18n;

        // --- 3. ROUTER & VIEWS ---
        const Router = {
            current: 'home',
            go: (page) => {
                Router.current = page;
                document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
                const btn = document.getElementById(`nav-${page}`);
                if(btn) btn.classList.add('active');

                const loader = document.getElementById('page-loader');
                const vp = document.getElementById('viewport');
                
                loader.classList.remove('hidden');
                setTimeout(() => loader.style.opacity = '1', 10);

                setTimeout(() => {
                    vp.innerHTML = '';
                    if (page === 'home') Views.home(vp);

                    // Create notification for the complaint author
                    const issue = DB.issues.find(i => String(i.id) === String(id));
                    if (issue && issue.author_id) {
                        const notifMessages = {
                            published: { ar: `تمت الموافقة على انشغالك "${issue.title}"`, en: `Your concern "${issue.title}" has been approved`, fr: `Votre préoccupation "${issue.title}" a été approuvée` },
                            resolved: { ar: `تم حل انشغالك "${issue.title}"`, en: `Your concern "${issue.title}" has been resolved`, fr: `Votre préoccupation "${issue.title}" a été résolue` },
                            rejected: { ar: `تم رفض انشغالك "${issue.title}"`, en: `Your concern "${issue.title}" has been rejected`, fr: `Votre préoccupation "${issue.title}" a été rejetée` },
                            temp_solution: { ar: `تم تقديم حل مؤقت لانشغالك "${issue.title}"`, en: `A temporary solution was provided for "${issue.title}"`, fr: `Une solution temporaire a été fournie pour "${issue.title}"` },
                            needs_info: { ar: `انشغالك "${issue.title}" يحتاج تفاصيل إضافية`, en: `Your concern "${issue.title}" needs more details`, fr: `Votre préoccupation "${issue.title}" nécessite plus de détails` }
                        };
                        const msg = notifMessages[status] || { ar: `تم تحديث حالة انشغالك "${issue.title}"`, en: `Your concern "${issue.title}" status updated`, fr: `Statut mis à jour` };
                        await supabaseClient.from('notifications').insert([{
                            user_id: issue.author_id,
                            message: JSON.stringify(msg),
                            type: status,
                            complaint_id: id,
                            is_read: false
                        }]).then(res => { if(res.error) console.warn('Notification insert warning:', res.error); });
                    }
                    
                    Swal.fire({toast:true, position:'top-end', icon:'success', title:'تم التحديث', background:'#1e293b', color:'#fff', showConfirmButton:false, timer:1500});
                    setTimeout(() => window.location.reload(), 1500);
                } catch(e) {
                    console.error(e);
                    Swal.fire({toast:true, position:'top-end', icon:'error', title:'حدث خطأ', background:'#1e293b', color:'#fff', showConfirmButton:false, timer:1500});
                }
            },

            solve: async (id) => {
                try {
                    const card = document.getElementById(`issue-${id}`);
                    if (card) {
                        card.style.transform = 'scale(0.95)';
                        card.style.opacity = '0';
                        setTimeout(() => card.remove(), 300);
                    }
                    const idx = DB.issues.findIndex(x => String(x.id) === String(id));
                    if (idx > -1) DB.issues.splice(idx, 1);
                    Swal.fire({toast:true, position:'top-end', icon:'success', title:'تم حل المشكلة', background:'#1e293b', color:'#fff', showConfirmButton:false, timer:1500});
                } catch (err) { console.error('Solve error', err); }
            },
            vote: (id) => {
                const card = document.getElementById(`issue-${id}`);
                card.style.transform = 'scale(0.95)';
                card.style.opacity = '0';
                setTimeout(() => card.remove(), 300);
                Swal.fire({toast:true, position:'top-end', icon:'info', title:'Voting started', background:'#1e293b', color:'#fff', showConfirmButton:false, timer:1500});
            },
            approveT: async (id) => {
                try {
                    const card = document.getElementById(`teach-${id}`);
                    if (card) {
                        card.style.transform = 'translateX(20px)';
                        card.style.opacity = '0';
                        setTimeout(() => card.remove(), 300);
                    }
                    const idx = DB.teachers.findIndex(x => String(x.id) === String(id));
                    if (idx > -1) DB.teachers.splice(idx, 1);
                    
                    const reqBadge = document.getElementById('badge-req');
                    if(reqBadge) {
                        reqBadge.innerText = DB.teachers.length;
                        if(DB.teachers.length === 0) reqBadge.classList.add('hidden');
                    }

                    Swal.fire({toast:true, position:'top-end', icon:'success', title:'تمت الموافقة', background:'#1e293b', color:'#fff', showConfirmButton:false, timer:1500});
                } catch (err) { console.error('Approve error', err); }
            }
        };

        const Voice = {
            start: (target, btnId) => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    return Swal.fire({icon:'error', text: I18n.get('err_mic'), background:'#1e293b', color:'#fff'});
                }
                try {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const rec = new SpeechRecognition();
                    const map = { ar: 'ar-SA', en: 'en-US', fr: 'fr-FR' };
                    rec.lang = map[I18n.current]; 
                    rec.interimResults = false;
                    const btn = document.getElementById(btnId);
                    rec.onstart = () => { if(btn) btn.classList.add('voice-active'); };
                    rec.onend = () => { if(btn) btn.classList.remove('voice-active'); };
                    rec.onresult = (e) => {
                        const txt = e.results[0][0].transcript;
                        const el = document.getElementById(target);
                        if(el) { el.value += (el.value ? ' ' : '') + txt; el.focus(); }
                    };
                    rec.start();
                } catch(e) { console.error("Voice Error", e); }
            }
        };

        const AI = {
            ask: (key) => {
                const prompts = {
                    summary: { ar: 'أعطني ملخصاً عن جميع الانشغالات الحالية في النظام', en: 'Give me a summary of all current issues in the system', fr: 'Donnez-moi un résumé de tous les problèmes actuels' },
                    draft: { ar: 'اكتب صياغة لإعلان إداري عن الامتحانات', en: 'Draft an administrative post about exams', fr: 'Rédiger une annonce administrative concernant les examens' },
                    advice: { ar: 'بماذا تنصحني للتعامل مع المشاكل العاجلة؟', en: 'What do you advise me to handle the urgent issues?', fr: 'Que me conseillez-vous pour gérer les problèmes urgents ?' }
                };
                document.getElementById('ai-input').value = prompts[key][I18n.current];
                AI.send();
            },
            send: async () => {
                const input = document.getElementById('ai-input');
                const txt = input.value.trim();
                if(!txt) return;
                
                AI.append(txt, 'user');
                input.value = '';
                
                const typingId = 'typing-' + Date.now();
                setTimeout(() => {
                    AI.append('<span id="'+typingId+'" class="flex gap-1 items-center"><span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce"></span><span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce delay-100"></span><span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce delay-200"></span></span>', 'ai');
                }, 100);

                try {
                    const dbContext = JSON.stringify(DB.issues.map(i => ({ title: i.title, role: i.role, status: i.status })));
                    const sysPrompt = `You are Atlas, a smart university administration assistant (version 11.4). You are connected to the live database. The current active concerns in the database are: ${dbContext}. Provide concise, professional, and helpful answers. Respond in the language of the user's prompt (usually Arabic, English, or French). Format your text with simple markdown.`;
                    
                    const responseText = await Gemini.call(txt, false, sysPrompt);
                    
                    const el = document.getElementById(typingId);
                    if(el && el.parentElement) el.parentElement.remove();
                    
                    AI.append(marked.parse(responseText), 'ai');
                } catch (error) {
                    const el = document.getElementById(typingId);
                    if(el && el.parentElement) el.parentElement.remove();
                    AI.append("<span class='text-red-400'>Error connecting to Gemini Engine.</span>", 'ai');
                }
            },
            append: (html, role) => {
                const box = document.getElementById('chat-messages');
                const style = role === 'user' ? 'bg-indigo-600 text-white self-end rounded-br-none' : 'bg-slate-800 text-slate-200 self-start rounded-bl-none border border-white/5 prose prose-invert prose-sm max-w-none';
                const div = document.createElement('div');
                div.className = `max-w-[85%] p-3 rounded-2xl text-xs leading-relaxed shadow-md animate-fade-in ${style} ${role === 'user' ? 'ml-auto' : 'mr-auto'}`;
                div.innerHTML = html;
                
                div.querySelectorAll('p').forEach(p => p.classList.add('mb-2', 'last:mb-0'));
                div.querySelectorAll('strong').forEach(s => s.classList.add('text-indigo-300'));
                div.querySelectorAll('ul').forEach(ul => ul.classList.add('list-disc', 'pl-4', 'rtl:pr-4', 'mb-2'));
                
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;
            }
        };

        const UI = {
            toggleSidebar: () => {
                const s = document.getElementById('sidebar');
                const o = document.getElementById('mobile-overlay');
                
                const isHidden = s.classList.contains('ltr:-translate-x-full') || s.classList.contains('rtl:translate-x-full') || s.classList.contains('-translate-x-full');
                
                if (isHidden) {
                    s.classList.remove('ltr:-translate-x-full', 'rtl:translate-x-full', '-translate-x-full');
                    o.classList.remove('hidden');
                } else {
                    s.classList.add('ltr:-translate-x-full', 'rtl:translate-x-full');
                    o.classList.add('hidden');
                }
            },
            closeSidebar: () => {
                const s = document.getElementById('sidebar');
                const o = document.getElementById('mobile-overlay');
                s.classList.add('ltr:-translate-x-full', 'rtl:translate-x-full');
                o.classList.add('hidden');
            },
            toggleChat: () => {
                if(!DB.settings.aiEnabled) return;
                const c = document.getElementById('atlas-window');
                const h = c.classList.contains('closed');
                if(h) {
                    c.classList.remove('closed');
                    c.classList.add('open');
                    const msgContainer = document.getElementById('chat-messages');
                    if(msgContainer.children.length === 0) setTimeout(() => AI.append(I18n.get('ai_welcome'), 'ai'), 400);
                    setTimeout(() => document.getElementById('ai-input').focus(), 500);
                } else {
                    UI.closeChat();
                }
            },
            closeChat: () => {
                const c = document.getElementById('atlas-window');
                c.classList.remove('open');
                c.classList.add('closed');
            },
            showMedia: (u) => {
                document.getElementById('media-img').src = u;
                document.getElementById('media-modal').classList.remove('hidden');
                setTimeout(() => document.getElementById('media-modal').classList.remove('opacity-0'), 10);
            },
            closeMedia: () => {
                const m = document.getElementById('media-modal');
                m.classList.add('opacity-0');
                setTimeout(() => { m.classList.add('hidden'); document.getElementById('media-img').src = ''; }, 300);
            }
        };

        const Auth = {
            logout: () => Swal.fire({ title: 'Signing out...', timer: 800, showConfirmButton: false, background: '#1e293b', color:'#fff', didOpen: () => Swal.showLoading() }).then(() => location.reload())
        };

        window.onload = async () => {
            Router.go('home');
            await DB.syncFromServer();
            
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('lang-menu');
                const wrapper = document.getElementById('lang-dropdown-wrapper');
                if (menu && wrapper && !wrapper.contains(e.target)) {
                    menu.classList.add('hidden');
                }
            });
        };
    </script>
</body>
</html>
