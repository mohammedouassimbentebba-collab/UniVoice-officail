        :root {

            min-height: 100vh;
            overflow-x: hidden;
        }

        body[lang="en"],

            font-family: 'Poppins', sans-serif;

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* الخلفية المتحركة */
        .bg-fixed-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #ffffff;
            background-image: radial-gradient(circle at 10% 10%, #f1f5f9, #ffffff);
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--neon-purple);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--neon-blue);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -30px);
            }
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: var(--glass);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .hover-scale {
            transition: transform 0.2s;
        }

        .hover-scale:hover {
            transform: scale(1.02);
        }

        .like-anim {
            animation: like-bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes like-bounce {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Input Styling */
        .input-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            color: var(--text-main);
            transition: all 0.3s;
        }

        .input-box:focus-within {
            border-color: var(--neon-blue);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.1);
        }

        /* Skeleton Loading Animation */
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* XP Bar */
        .xp-container {
            background: rgba(0, 0, 0, 0.3);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            width: 65%;
            transition: width 1s ease-out;
        }

        /* Scroll Reveal Animation */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Voice Wave Animation */
        .voice-wave {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            height: 20px;
        }

        .voice-bar {
            width: 3px;
            background: #ef4444;
            animation: wave 0.5s ease-in-out infinite;
            border-radius: 2px;
        }

        .voice-bar:nth-child(1) {
            height: 10px;
            animation-delay: 0.1s;
        }

        .voice-bar:nth-child(2) {
            height: 15px;
            animation-delay: 0.2s;
        }

        .voice-bar:nth-child(3) {
            height: 20px;
            animation-delay: 0.3s;
        }

        .voice-bar:nth-child(4) {
            height: 15px;
            animation-delay: 0.2s;
        }

        .voice-bar:nth-child(5) {
            height: 10px;
            animation-delay: 0.1s;
        }

        @keyframes wave {

            0%,
            100% {
                height: 5px;
            }

            50% {
                height: 20px;
            }
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: var(--neon-green);
            animation: blink 1s infinite;
            vertical-align: sub;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;

    <script>

        // --- Core Application Logic with Supabase ---
        let supabaseClient = window.supabaseClient;
        let currentUser = null;
        let currentUserProfile = null;
        let currentFilter = 'newest';

        // Initialize App
        (async function initApp() {
            if (!supabaseClient) {
                console.warn('Supabase not configured');
                return;
            }

            try {
                const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError || !sessionData || !sessionData.session) {
                    window.location.href = 'index.html';
                    return;
                }

                currentUser = sessionData.session.user;

                // Load Enhanced Profile with Joins
                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('id, first_name, last_name, specialty, study_year, matricule, avatar_url, preferred_language, university_id, role, universities (name, logo_url)')
                    .eq('id', currentUser.id)
                    .single();

                const safeProfile = profile || {};

                if (profileError || safeProfile.role !== 'student') {
                    window.location.href = 'index.html';
                    return;
                }

                currentUserProfile = safeProfile;
                applyProfileData(safeProfile);
                
                // Initialize Language
                const savedSiteLang = localStorage.getItem('site_language');
                if (savedSiteLang && ['ar','en','fr'].includes(savedSiteLang)) {
                    changeLang(savedSiteLang);
                } else if (profile?.preferred_language && ['ar','en','fr'].includes(profile.preferred_language)) {
                    changeLang(profile.preferred_language);
                } else {
                    changeLang('ar');
                }

                // Initial Data Load
                loadAnnouncements();
                loadFeed('newest');
                loadNotifications();

            } catch (ex) {
                console.error('Initialization failed', ex);
            }
        })();

        // Map Profile Data to UI
        function applyProfileData(profile) {
            const safeProfile = profile || {};
            const fullName = `${safeProfile.first_name || ''} ${safeProfile.last_name || ''}`.trim() || 'طالب';
            const univName = safeProfile.universities?.name || 'جامعة باتنة 2';
            const univLogo = safeProfile.universities?.logo_url;

            const setTxt = (id, text) => { const el = document.getElementById(id); if (el) el.innerText = text; };
            setTxt('display-name', fullName);

        function toggleNotifications() {

        async function loadNotifications() {
            if (!supabaseClient || !currentUser) return;
            const list = document.getElementById('notif-list');
            const badge = document.getElementById('notif-badge');
            const t = translations[currentLang];

            try {
                const { data: notifs, error } = await supabaseClient
                    .from('notifications')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false })
                    .limit(20);

                if (error) throw error;

                const unread = (notifs || []).filter(n => !n.is_read);
                if (unread.length > 0) {
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }

                if (!notifs || notifs.length === 0) {
                    list.innerHTML = `<div class="p-4 text-center text-slate-400 text-xs">${t.emptyFeed || 'لا توجد إشعارات'}</div>`;
                    return;
                }

                const iconMap = {
                    approved: { icon: 'fa-check', bg: 'bg-green-100', color: 'text-green-600' },
                    resolved: { icon: 'fa-check-double', bg: 'bg-blue-100', color: 'text-blue-600' },
                    rejected: { icon: 'fa-times', bg: 'bg-red-100', color: 'text-red-600' },
                    temp_solution: { icon: 'fa-wrench', bg: 'bg-orange-100', color: 'text-orange-600' },
                    needs_info: { icon: 'fa-question-circle', bg: 'bg-yellow-100', color: 'text-yellow-600' }
                };

                list.innerHTML = notifs.map(n => {
                    const ic = iconMap[n.type] || iconMap.approved;
                    let msg = n.message;
                    try { const parsed = JSON.parse(n.message); msg = parsed[currentLang] || parsed.ar || n.message; } catch(e) { /* plain text */ }
                    const timeAgo = getTimeAgo(new Date(n.created_at));
                    return `
                    <div class="p-3 border-b border-slate-100 hover:bg-slate-50 cursor-pointer transition flex gap-3 ${n.is_read ? 'opacity-60' : ''}" onclick="markNotificationRead('${n.id}')">
                        <div class="w-8 h-8 rounded-full ${ic.bg} ${ic.color} flex items-center justify-center text-xs shrink-0">
                            <i class="fas ${ic.icon}"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="text-xs text-slate-800 leading-relaxed">${msg}</p>
                            <span class="text-[10px] text-slate-400">${timeAgo}</span>
                        </div>
                        ${!n.is_read ? '<div class="w-2 h-2 bg-blue-500 rounded-full self-center shrink-0 ml-auto"></div>' : ''}
                    </div>`;
                }).join('');
            } catch(err) {
                console.error('Notifications error:', err);
                list.innerHTML = '<div class="p-4 text-center text-red-400 text-xs">خطأ في تحميل الإشعارات</div>';
            }
        }

        function getTimeAgo(date) {
            const diff = Math.floor((Date.now() - date.getTime()) / 1000);
            if (diff < 60) return currentLang === 'ar' ? 'الآن' : 'Just now';
            if (diff < 3600) return currentLang === 'ar' ? `منذ ${Math.floor(diff/60)} دقيقة` : `${Math.floor(diff/60)}m ago`;
            if (diff < 86400) return currentLang === 'ar' ? `منذ ${Math.floor(diff/3600)} ساعة` : `${Math.floor(diff/3600)}h ago`;
            return currentLang === 'ar' ? `منذ ${Math.floor(diff/86400)} يوم` : `${Math.floor(diff/86400)}d ago`;
        }

        async function markNotificationRead(notifId) {
            if (!supabaseClient) return;
            await supabaseClient.from('notifications').update({ is_read: true }).eq('id', notifId);
            loadNotifications();
        }

        async function markAllNotificationsRead() {
            if (!supabaseClient || !currentUser) return;

        }

        async function toggleVote(btn, complaintId) {
            const isVoted = btn.classList.contains('voted');
            const countSpan = btn.querySelector('.count');
            const icon = btn.querySelector('i');
            let count = parseInt(countSpan.innerText) || 0;

            if (isVoted) {
                // Optimistic UI - Decrease
                count--;
                btn.classList.remove('voted', 'bg-blue-500/20', 'border-blue-500/50');
                btn.classList.add('bg-slate-100/50', 'border-transparent');
                icon.classList.remove('text-blue-500');
                icon.classList.add('text-slate-400');
                countSpan.classList.remove('text-blue-700');
                countSpan.classList.add('text-slate-500');
                countSpan.innerText = count;
                const pIndex = currentPosts.findIndex(p => p.id === complaintId); if(pIndex !== -1) { currentPosts[pIndex].hasVoted = false; currentPosts[pIndex].votes = count; }

                await supabaseClient.from('complaint_votes').delete().eq('complaint_id', complaintId).eq('user_id', currentUser.id);
                await supabaseClient.from('complaints').update({ votes_count: count }).eq('id', complaintId);

            } else {
                // Optimistic UI - Increase
                count++;
                btn.classList.add('voted', 'bg-blue-500/20', 'border-blue-500/50', 'like-anim');
                btn.classList.remove('bg-slate-100/50', 'border-transparent');
                icon.classList.remove('text-slate-400');
                icon.classList.add('text-blue-500');
                countSpan.classList.remove('text-slate-500');
                countSpan.classList.add('text-blue-700');
                countSpan.innerText = count;
                const pIndex = currentPosts.findIndex(p => p.id === complaintId); if(pIndex !== -1) { currentPosts[pIndex].hasVoted = true; currentPosts[pIndex].votes = count; }

                await supabaseClient.from('complaint_votes').insert([{ complaint_id: complaintId, user_id: currentUser.id }]);
                await supabaseClient.from('complaints').update({ votes_count: count }).eq('id', complaintId);
            }
        }

        // --- Publish & AI Logic ---
        async function publishPost() {

            const file = fileInput.files[0];

            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;

                let media_url = null;
                if (file) {
                    const fileExt = file.name.split('.').pop();

        async function activateAtlas() {
            const content = document.getElementById('post-content').value;
            const category = document.getElementById('category').value;
            const title = document.getElementById('post-title').value;
            const suggestionBox = document.getElementById('atlas-suggestion');
            const suggestionText = document.getElementById('atlas-text');
            const t = translations[currentLang];
            if (!content) { showToast(t.missingText || "Text missing", "error"); return; }

            suggestionBox.classList.remove('hidden');
            suggestionText.innerHTML = '<span class="cursor-blink"></span> ' + (t.connectingGemini || 'Connecting to Gemini...');

            try {
                const langMap = { ar: 'Arabic', en: 'English', fr: 'French' };
                const promptText = `You are Atlas, a smart university administration assistant.
Analyze this student concern and do two things:
1. Rewrite it in a professional, polite, and well-structured administrative tone.
2. Determine which administrative level should handle this concern.

Title: ${title}
Category: ${category}
Original Text: ${content}

Return your response as a JSON object with exactly these keys:
- "refined_text": The enhanced text in ${langMap[currentLang] || 'Arabic'} language.
- "suggested_level": One of these values ONLY: "department" (for simple pedagogical complaints handled by the department head), "institute" (for problems concerning the institute or faculty), "university" (for major university-wide problems).

IMPORTANT: Return ONLY valid JSON, no extra text.`;

                const { data, error } = await supabaseClient.functions.invoke('gemini-proxy', {
                    body: { prompt: promptText, isJson: true }
                });
                
                if (error) throw error;
                
                let result;
                try {
                    result = typeof data.text === 'string' ? JSON.parse(data.text) : data.text;
                } catch(parseErr) {
                    // Fallback: treat entire response as refined text
                    result = { refined_text: data.text || data, suggested_level: 'department' };
                }

                const refinedText = result.refined_text || data.text || '';
                const suggestedLevel = ['department','institute','university'].includes(result.suggested_level) ? result.suggested_level : 'department';
                lastSuggestedLevel = suggestedLevel;

                const levelLabels = { department: t.levelDepartment || 'قسم', institute: t.levelInstitute || 'معهد / كلية', university: t.levelUniversity || 'جامعة' };
                const levelColors = { department: 'bg-emerald-100 text-emerald-700 border-emerald-200', institute: 'bg-amber-100 text-amber-700 border-amber-200', university: 'bg-red-100 text-red-700 border-red-200' };
                const safeText = refinedText.replace(/`/g, '\\`');
                
                suggestionText.innerHTML = `
                    <div class="mb-3 text-slate-700 leading-relaxed font-medium whitespace-pre-wrap">${refinedText}</div>
                    <div class="flex items-center gap-3 flex-wrap">
                        <span class="px-3 py-1.5 rounded-lg text-xs font-bold border ${levelColors[suggestedLevel]}">
                            <i class="fas fa-layer-group mr-1"></i> ${t.suggestedLevel || 'المستوى المقترح:'} ${levelLabels[suggestedLevel]}
                        </span>
                        <button type="button" onclick="acceptAtlasSuggestion(\`${safeText}\`)" class="bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-2 px-4 rounded-xl text-xs flex items-center gap-2 transition shadow-sm border border-blue-200">
                            <i class="fas fa-check"></i> ${t.acceptSuggestion || 'Accept Suggestion'}
                        </button>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                suggestionText.innerHTML = `<span class="text-red-500">${t.geminiFailed || 'Failed to connect to Gemini'}</span>`;
            }
        }

        function handleImageUpload(event) { const file = event.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = function (e) { document.getElementById('preview-img').src = e.target.result; document.getElementById('image-preview-container').classList.remove('hidden'); }; reader.readAsDataURL(file); } }

        function updateClock() {
            const now = new Date();

        let isRecording = false;
        function toggleVoiceInput() {
            const btn = document.getElementById('voice-btn');
            const textArea = document.getElementById('post-content');
            if (!('webkitSpeechRecognition' in window)) { alert("المتصفح لا يدعم الإملاء الصوتي."); return; }
            if (!isRecording) {
                isRecording = true; btn.classList.add('text-red-500');
                btn.innerHTML = `<div class="voice-wave"><div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div></div>`;
                textArea.placeholder = "أطلس يستمع إليك...";
                const recognition = new webkitSpeechRecognition();
                recognition.lang = currentLang === 'ar' ? "ar-SA" : (currentLang === 'fr' ? "fr-FR" : "en-US");
                recognition.onresult = function (event) { textArea.value += event.results[0][0].transcript + " "; };
                recognition.onend = function () { isRecording = false; btn.classList.remove('text-red-500'); btn.innerHTML = '<i class="fas fa-microphone"></i>'; textArea.placeholder = translations[currentLang].createDetailsPlaceholder; };
                recognition.start();
            } else { isRecording = false; }
        }

        function setupScrollReveal() {
            const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('active'); } }); }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        const canvasBg = document.createElement('canvas'); canvasBg.style.position = 'fixed'; canvasBg.style.top = '0'; canvasBg.style.left = '0'; canvasBg.style.width = '100%'; canvasBg.style.height = '100%'; canvasBg.style.zIndex = '-2'; canvasBg.style.pointerEvents = 'none'; document.body.appendChild(canvasBg);
        const ctx = canvasBg.getContext('2d'); function resizeCanvas() { canvasBg.width = window.innerWidth; canvasBg.height = window.innerHeight; } window.addEventListener('resize', resizeCanvas); resizeCanvas();
        let particles = []; class Particle { constructor() { this.x = Math.random() * canvasBg.width; this.y = Math.random() * canvasBg.height; this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5; this.size = Math.random() * 2; } update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > canvasBg.width) this.vx *= -1; if (this.y < 0 || this.y > canvasBg.height) this.vy *= -1; } draw() { ctx.fillStyle = 'rgba(100,116,139,0.2)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); } } for (let i = 0; i < 30; i++) particles.push(new Particle()); function animateBg() { ctx.clearRect(0, 0, canvasBg.width, canvasBg.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateBg); } animateBg();
</script>
